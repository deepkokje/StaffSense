[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "staffsense-backend"
version = "0.1.0"
description = "StaffSense salary management backend scaffold"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "pydantic-settings==2.7.0",
    "SQLAlchemy==2.0.36",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
